name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  ci:
    name: CI Pipeline (Lint, TypeScript, Tests, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run CI Pipeline
        env:
          VITE_POCKETBASE_URL: https://mock-pocketbase.internal
        run: npm run ci
